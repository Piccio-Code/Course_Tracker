<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top Hat -->
  <ellipse cx="100" cy="85" rx="45" ry="8" fill="#1a1a1a"/>
  <rect x="70" y="35" width="60" height="50" rx="2" fill="#2d2d2d"/>
  <rect x="55" y="80" width="90" height="12" rx="2" fill="#1a1a1a"/>
  
  <!-- Hat Band (Gold) -->
  <rect x="70" y="72" width="60" height="8" fill="#D4AF37"/>
  <circle cx="100" cy="76" r="6" fill="#FFD700" stroke="#D4AF37" stroke-width="1"/>
  
  <!-- Monocle -->
  <circle cx="100" cy="110" r="12" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="100" cy="110" r="10" fill="rgba(255,255,255,0.1)" stroke="#FFD700" stroke-width="1"/>
  
  <!-- Mustache -->
  <path d="M 100 125 Q 85 130, 70 125 Q 60 120, 55 110 Q 52 105, 60 108 Q 75 115, 85 120 Q 92 123, 100 125 Z" 
        fill="#3d2817" stroke="#2d1810" stroke-width="1"/>
  <path d="M 100 125 Q 115 130, 130 125 Q 140 120, 145 110 Q 148 105, 140 108 Q 125 115, 115 120 Q 108 123, 100 125 Z" 
        fill="#3d2817" stroke="#2d1810" stroke-width="1"/>
  
  <!-- Mustache curls -->
  <path d="M 55 110 Q 48 108, 45 100 Q 43 95, 47 95 Q 52 98, 55 105" 
        fill="#3d2817" stroke="#2d1810" stroke-width="1"/>
  <path d="M 145 110 Q 152 108, 155 100 Q 157 95, 153 95 Q 148 98, 145 105" 
        fill="#3d2817" stroke="#2d1810" stroke-width="1"/>
  
  <!-- Highlights on mustache -->
  <ellipse cx="75" cy="118" rx="8" ry="3" fill="#4d3827" opacity="0.6"/>
  <ellipse cx="125" cy="118" rx="8" ry="3" fill="#4d3827" opacity="0.6"/>
</svg>

